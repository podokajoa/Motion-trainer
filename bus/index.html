<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>버스 바로</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1626">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#0d1626; --card:#16233a; --line:#26385a; --fg:#eef4ff; --muted:#93a4c2; --blue:#3ba7ff; --green:#5ee08a; --warn:#ffb454; --red:#ff7a7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; -webkit-tap-highlight-color:transparent; }
  main { max-width:560px; margin:0 auto; padding:12px 12px 96px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:2px 4px 10px; }
  h1 { font-size:20px; margin:0; }
  .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; cursor:pointer; }
  button.ghost { background:none; border:none; color:var(--muted); padding:6px 8px; font-size:14px; }
  .stop { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px; }
  .stop-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .stop-name { font-size:17px; font-weight:800; word-break:keep-all; }
  .stop-dir { color:var(--muted); font-size:12px; margin-left:6px; font-weight:400; }
  .arr { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); margin-top:8px; }
  .arr:first-of-type { margin-top:6px; }
  .route { flex:0 0 auto; min-width:72px; font-size:20px; font-weight:800; background:#0b1424; border:1px solid var(--line); border-radius:10px; padding:4px 10px; text-align:center; }
  .t1 { flex:1; font-size:34px; font-weight:900; line-height:1; letter-spacing:-.5px; }
  .t1 small { font-size:15px; font-weight:700; margin-left:2px; }
  .t1.soon { color:var(--green); }
  .t1.none { color:var(--muted); font-size:18px; font-weight:700; }
  .t2 { text-align:right; font-size:15px; color:var(--muted); line-height:1.3; }
  .t2 b { color:var(--fg); font-size:17px; }
  .note { color:var(--muted); font-size:13px; line-height:1.5; padding:6px 0 2px; }
  .note.err { color:var(--warn); }
  .link-btn { margin-top:8px; width:100%; background:var(--blue); color:#04111f; border:none; font-weight:800; }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:16px; padding:18px; line-height:1.65; color:var(--muted); font-size:15px; }
  .empty b { color:var(--fg); }
  .fab { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); background:var(--blue); color:#04111f; border:none; font-weight:800; font-size:16px; padding:14px 24px; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  dialog { width:min(520px, calc(100vw - 24px)); max-height:calc(100vh - 32px); overflow:auto; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:18px; padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h2 { margin:0 0 10px; font-size:19px; }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 5px; }
  input[type=text], input[type=url], input:not([type]) { width:100%; font:inherit; font-size:17px; color:var(--fg); background:#0b1424; border:1px solid var(--line); border-radius:12px; padding:12px; }
  input:focus { outline:2px solid var(--blue); border-color:transparent; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; } .seg button.on { background:var(--blue); color:#04111f; border-color:var(--blue); font-weight:800; }
  .hint { font-size:13px; color:var(--muted); line-height:1.6; margin-top:6px; }
  .hint b { color:var(--fg); }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .row .save { background:var(--blue); color:#04111f; border:none; font-weight:800; }
  .row .del { margin-right:auto; color:var(--red); border-color:#5a2a2a; }
  .res { margin-top:8px; }
  .res button { display:block; width:100%; text-align:left; margin-bottom:6px; }
  .res small { display:block; color:var(--muted); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chips label { margin:0; display:flex; align-items:center; gap:6px; background:#0b1424; border:1px solid var(--line); border-radius:10px; padding:8px 12px; color:var(--fg); font-size:16px; }
  .err { color:var(--warn); font-size:13px; margin-top:6px; min-height:1em; }
  .toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#24375a; border:1px solid var(--blue); border-radius:12px; padding:10px 16px; font-size:15px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:30; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>버스 바로</h1>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
    <div>
      <button class="ghost" id="refreshBtn">새로고침</button>
      <button class="ghost" id="setBtn">설정</button>
    </div>
  </header>
  <section id="list"></section>
</main>
<button class="fab" id="addBtn">＋ 정류장 추가</button>

<dialog id="add">
  <h2 id="addTitle">정류장 추가</h2>
  <label>지역</label>
  <div class="seg" id="citySeg"><button type="button" data-c="seoul" class="on">서울</button><button type="button" data-c="gg">경기</button></div>
  <label for="qIn">정류장 이름</label>
  <div style="display:flex;gap:8px"><input id="qIn" placeholder="예: 양재역, 매헌초교" autocomplete="off"><button type="button" id="qBtn" style="flex:0 0 auto">찾기</button></div>
  <div class="err" id="addErr"></div>
  <div class="res" id="res"></div>
  <div id="pick" hidden>
    <label>이 정류장에서 탈 버스 (지금 오는 버스 중에서 고르세요)</label>
    <div class="chips" id="chips"></div>
    <label for="extra">목록에 없는 버스 (쉼표로 구분, 선택)</label>
    <input id="extra" placeholder="예: 11-3" autocomplete="off">
    <div class="hint">고르지 않으면 이 정류장의 모든 버스가 보여요.</div>
  </div>
  <div class="row"><button type="button" id="addCancel">취소</button><button type="button" class="save" id="addSave" disabled>저장</button></div>
</dialog>

<dialog id="settings">
  <h2>설정</h2>
  <label for="relayIn">중계 서버 주소</label>
  <input id="relayIn" type="url" inputmode="url" placeholder="https://bus-relay.내이름.workers.dev" autocomplete="off">
  <div class="err" id="setErr"></div>
  <div class="hint">서울·경기 버스 정보를 가져오는 작은 서버예요. 만드는 방법은 <b>bus/relay/README.md</b>에 있어요.</div>
  <div class="row"><button type="button" class="del" id="delStops">모든 정류장 지우기</button><button type="button" id="setCancel">닫기</button><button type="button" class="save" id="setSave">저장</button></div>
</dialog>

<dialog id="editD">
  <h2 id="editTitle">정류장 수정</h2>
  <label for="eBus">탈 버스 (쉼표로 구분, 비우면 전부)</label>
  <input id="eBus" autocomplete="off">
  <div class="row"><button type="button" class="del" id="eDel">삭제</button><button type="button" id="eCancel">취소</button><button type="button" class="save" id="eSave">저장</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const KEY = "bus-live-v1", OLD = "bus-shortcut-v1", RELAY = "bus-live-relay";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const norm = s => String(s).replace(/\s+/g, "").replace(/번$/, "").toLowerCase();
const rd = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } };
const wr = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

let stops = loadStops();
let relay = rd(RELAY, "").replace(/\/+$/, "");
let data = {};       // stop.id -> { items, at, error }
let busy = false, timer = null;

function loadStops() {
  try {
    const v = JSON.parse(rd(KEY, "null"));
    if (Array.isArray(v)) return v;
    // 예전 버전(바로가기)에 저장해 둔 정류장 가져오기: 아직 연결 안 된 상태로
    const old = JSON.parse(rd(OLD, "[]"));
    return (Array.isArray(old) ? old : []).map(s => ({ id: s.id, name: s.name, dir: s.dir || "", buses: s.buses || [], city: "", stId: "" }));
  } catch { return []; }
}
const save = () => wr(KEY, JSON.stringify(stops));
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

async function api(path, params) {
  if (!relay) throw new Error("먼저 설정에서 중계 서버 주소를 넣어 주세요");
  const r = await fetch(relay + path + "?" + new URLSearchParams(params), { cache: "no-store" });
  const j = await r.json().catch(() => ({ error: "서버 응답을 읽을 수 없어요" }));
  if (!r.ok || j.error) throw new Error(j.error || "서버 오류 " + r.status);
  return j;
}

// ---- 시간 표시 ----
function fmt(sec, msg) {
  if (sec == null || sec < 0) return { big: "", cls: "none", txt: msg || "정보 없음" };
  if (sec < 60) return { big: "곧", unit: "", cls: "soon" };
  return { big: Math.floor(sec / 60), unit: "분", cls: sec < 180 ? "soon" : "" };
}
function matchBus(item, wanted) {
  if (!wanted.length) return true;
  const r = norm(item.route);
  return wanted.some(w => { const n = norm(w); return r === n || r.endsWith(n) || n.endsWith(r); });
}
function sortItems(a, b) {
  const x = a.sec1 ?? 1e9, y = b.sec1 ?? 1e9; return x - y;
}

function render() {
  const list = $("list");
  if (!stops.length) {
    list.innerHTML = `<div class="empty"><b>정류장이 아직 없어요.</b><br>아래 <b>＋ 정류장 추가</b>로 자주 타는 정류장과 버스를 고르면, 이 화면에 몇 분 뒤에 오는지 한꺼번에 보여요.${relay ? "" : "<br><br>먼저 오른쪽 위 <b>설정</b>에서 중계 서버 주소를 넣어야 해요."}</div>`;
    return;
  }
  list.innerHTML = stops.map(s => {
    const head = `<div class="stop-head"><div class="stop-name">${esc(s.name)}<span class="stop-dir">${esc(s.dir || "")}</span></div><button class="ghost" data-edit="${s.id}">수정</button></div>`;
    if (!s.stId) return `<article class="stop">${head}<div class="note">아직 실시간 정보와 연결되지 않았어요.</div><button class="link-btn" data-link="${s.id}">정류장 찾아서 연결</button></article>`;
    const d = data[s.id];
    let body;
    if (!d) body = `<div class="note">불러오는 중…</div>`;
    else if (d.error) body = `<div class="note err">${esc(d.error)}</div>`;
    else {
      const items = d.items.filter(i => matchBus(i, s.buses || [])).sort(sortItems);
      if (!items.length) body = `<div class="note">${(s.buses || []).length ? "지금 도착 예정인 " + esc(s.buses.join(", ")) + "번 정보가 없어요 (운행 끝났거나 아직 출발 전)." : "도착 예정 버스가 없어요."}</div>`;
      else body = items.map(i => {
        const a = fmt(i.sec1, i.msg1), b = fmt(i.sec2, "");
        const t1 = a.big === "" ? `<div class="t1 none">${esc(a.txt)}</div>` : `<div class="t1 ${a.cls}">${a.big}<small>${a.unit}</small></div>`;
        const t2 = b.big === "" ? "" : `<div class="t2">다음<br><b>${b.big}${b.unit}</b></div>`;
        return `<div class="arr"><div class="route">${esc(i.route)}</div>${t1}${t2}</div>`;
      }).join("");
    }
    return `<article class="stop">${head}${body}</article>`;
  }).join("");
  const ats = Object.values(data).map(d => d.at).filter(Boolean);
  $("sub").textContent = ats.length ? new Date(Math.max(...ats)).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + " 기준 · 30초마다 자동 갱신" : " ";
}

async function refresh() {
  if (busy || !relay) { render(); return; }
  busy = true;
  await Promise.all(stops.filter(s => s.stId).map(async s => {
    try { const j = await api("/arrive", { city: s.city, id: s.stId }); data[s.id] = { items: j.items || [], at: Date.now() }; }
    catch (e) { data[s.id] = { error: e.message, at: data[s.id]?.at, items: [] }; }
  }));
  busy = false; render();
}
function startTimer() { clearInterval(timer); timer = setInterval(() => { if (!document.hidden) refresh(); }, 30000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

// ---- 추가 ----
let city = "seoul", picked = null, relinkId = null;
$("citySeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; city = b.dataset.c; [...$("citySeg").children].forEach(x => x.classList.toggle("on", x === b)); };
function openAdd(prefill, relink) {
  relinkId = relink || null; picked = null;
  $("addTitle").textContent = relink ? "정류장 연결" : "정류장 추가";
  $("qIn").value = prefill || ""; $("res").innerHTML = ""; $("pick").hidden = true; $("addErr").textContent = ""; $("addSave").disabled = true; $("extra").value = "";
  $("add").showModal();
}
$("addBtn").onclick = () => openAdd();
$("addCancel").onclick = () => $("add").close();
$("qBtn").onclick = search;
$("qIn").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
async function search() {
  const q = $("qIn").value.trim(); if (!q) return;
  $("addErr").textContent = ""; $("res").innerHTML = "<div class='hint'>찾는 중…</div>"; $("pick").hidden = true; $("addSave").disabled = true;
  try {
    const j = await api("/search", { city, q });
    if (!j.stops.length) { $("res").innerHTML = ""; $("addErr").textContent = "찾은 정류장이 없어요. 이름을 줄여서 다시 찾아보세요 (예: 양재역)." + (j.info ? "\n[서버 응답] " + j.info : "");$("addErr").style.whiteSpace = "pre-wrap";$("addErr").style.wordBreak = "break-all"; return; }
    $("res").innerHTML = j.stops.slice(0, 20).map((s, i) => `<button type="button" data-i="${i}">${esc(s.name)}<small>${esc(s.dir)}</small></button>`).join("");
    $("res").onclick = e => { const b = e.target.closest("button"); if (b) choose(j.stops[+b.dataset.i]); };
  } catch (e) { $("res").innerHTML = ""; $("addErr").textContent = e.message; }
}
async function choose(s) {
  picked = s; $("res").innerHTML = `<div class="hint"><b>${esc(s.name)}</b> ${esc(s.dir)}</div>`;
  $("pick").hidden = false; $("chips").innerHTML = "<span class='hint'>지금 오는 버스 확인 중…</span>"; $("addSave").disabled = false;
  const stop = stops.find(x => x.id === relinkId);
  const pre = new Set((stop?.buses || []).map(norm));
  try {
    const j = await api("/arrive", { city, id: s.id });
    const routes = [...new Set(j.items.map(i => i.route))];
    $("chips").innerHTML = routes.length ? routes.map(r => `<label><input type="checkbox" value="${esc(r)}" ${pre.has(norm(r)) ? "checked" : ""}>${esc(r)}</label>`).join("") : "<span class='hint'>지금 오는 버스가 없어요. 아래에 직접 적어도 돼요.</span>";
  } catch (e) { $("chips").innerHTML = `<span class='hint'>${esc(e.message)}</span>`; }
  if (stop && !$("extra").value) { const known = new Set([...$("chips").querySelectorAll("input")].map(x => norm(x.value))); $("extra").value = (stop.buses || []).filter(b => !known.has(norm(b))).join(", "); }
}
$("addSave").onclick = () => {
  if (!picked) return;
  const chosen = [...$("chips").querySelectorAll("input:checked")].map(x => x.value);
  const extra = $("extra").value.split(/[,，、]/).map(x => x.trim()).filter(Boolean);
  const buses = [...new Set([...chosen, ...extra])];
  const prev = stops.find(x => x.id === relinkId);
  if (prev) Object.assign(prev, { city, stId: picked.id, name: prev.name || picked.name, dir: picked.dir, buses });
  else stops.push({ id: uid(), city, stId: picked.id, name: picked.name, dir: picked.dir, buses });
  save(); $("add").close(); toast("저장했어요"); refresh();
};

// ---- 수정 ----
let editId = null;
$("list").addEventListener("click", e => {
  const l = e.target.closest("[data-link]"); if (l) { const s = stops.find(x => x.id === l.dataset.link); openAdd(s.name, s.id); return; }
  const b = e.target.closest("[data-edit]"); if (!b) return;
  editId = b.dataset.edit; const s = stops.find(x => x.id === editId);
  $("editTitle").textContent = s.name; $("eBus").value = (s.buses || []).join(", "); $("editD").showModal();
});
$("eCancel").onclick = () => $("editD").close();
$("eSave").onclick = () => { const s = stops.find(x => x.id === editId); s.buses = $("eBus").value.split(/[,，、]/).map(x => x.trim()).filter(Boolean); save(); $("editD").close(); render(); };
$("eDel").onclick = () => { const s = stops.find(x => x.id === editId); if (confirm(`"${s.name}" 정류장을 지울까요?`)) { stops = stops.filter(x => x.id !== editId); delete data[editId]; save(); $("editD").close(); render(); } };

// ---- 설정 ----
$("setBtn").onclick = () => { $("relayIn").value = relay; $("setErr").textContent = ""; $("settings").showModal(); };
$("setCancel").onclick = () => $("settings").close();
$("setSave").onclick = async () => {
  const v = $("relayIn").value.trim().replace(/\/+$/, "");
  if (!/^https:\/\/\S+$/.test(v)) { $("setErr").textContent = "https:// 로 시작하는 주소를 넣어 주세요"; return; }
  $("setErr").textContent = "확인 중…";
  try {
    const r = await fetch(v + "/ping", { cache: "no-store" }); const j = await r.json();
    if (!j.ok) throw 0;
    relay = v; wr(RELAY, v); $("settings").close();
    toast(j.seoul && j.gg ? "연결됐어요" : "연결은 됐는데 " + (!j.seoul ? "서울 " : "") + (!j.gg ? "경기 " : "") + "키가 비어 있어요");
    refresh();
  } catch { $("setErr").textContent = "이 주소로 연결할 수 없어요. 주소를 다시 확인해 주세요."; }
};
$("delStops").onclick = () => { if (confirm("저장한 정류장을 모두 지울까요?")) { stops = []; data = {}; save(); $("settings").close(); render(); } };
$("refreshBtn").onclick = () => { refresh(); toast("새로고침"); };

render(); refresh(); startTimer();
if (!relay && stops.length) toast("설정에서 중계 서버 주소를 넣어 주세요");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
