name: 여행 발자국 APK

on:
  push:
    branches: [main]
    paths: ["travel-footprints/**", ".github/workflows/travel-footprints-apk.yml"]
  pull_request:
    paths: ["travel-footprints/**", ".github/workflows/travel-footprints-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: travel-footprints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-footprints
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # 기존에 설치된 앱(집 PC에서 빌드)과 같은 서명으로 만들어야
      # 앱을 지우지 않고 업데이트할 수 있다. 키는 저장소 Secret에만 둔다.
      - name: 서명키 준비
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "SIGNING=home-pc" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 Secret이 없어 임시 키로 서명합니다. 이 APK는 기존 앱 위에 업데이트로 설치되지 않습니다."
            echo "SIGNING=temporary" >> "$GITHUB_ENV"
          fi

      - name: 단위 테스트
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK 빌드
        run: ./gradlew --no-daemon assembleDebug

      - name: 서명 확인
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | head -5 || true
          cp "$APK" ../travel-footprints.apk

      - uses: actions/upload-artifact@v4
        with:
          name: travel-footprints-apk
          path: travel-footprints.apk

      # main에 올라간 빌드만 폰에서 바로 받을 수 있는 고정 링크로 올린다.
      - name: 다운로드 링크 갱신
        if: github.ref == 'refs/heads/main' && env.SIGNING == 'home-pc'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' travel-footprints/app/build.gradle.kts | cut -d'"' -f2)
          TAG=travel-footprints-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" travel-footprints.apk \
            --title "여행 발자국 v$VERSION" \
            --notes "폰에서 travel-footprints.apk를 눌러 설치하세요. 기존 앱은 지우지 말고 업데이트로 설치합니다. (커밋 ${GITHUB_SHA::7})" \
            --latest=false
