name: 시간 지킴이 APK

on:
  push:
    branches: [main]
    paths: ["timeguard/**", ".github/workflows/timeguard-apk.yml"]
  pull_request:
    paths: ["timeguard/**", ".github/workflows/timeguard-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timeguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timeguard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # 같은 키로 계속 서명해야 다음 버전을 지우지 않고 덮어 설치할 수 있다. 키는 저장소 Secret에만 둔다.
      - name: 서명키 준비
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            KS="$RUNNER_TEMP/debug.keystore"
            echo "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$KS"
            echo "TG_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 Secret이 없어 임시 키로 서명합니다."
          fi

      - name: 단위 테스트
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK 빌드
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../timeguard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: timeguard-apk
          path: timeguard.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: timeguard-apk

      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 실제 폰 화면처럼 에뮬레이터에서 띄워 찍는다. 숫자는 예시 데이터(demo)다.
      - name: 화면 캡처
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p shots
            adb install -r timeguard.apk
            adb shell settings put system system_locales ko-KR || true
            adb shell am start -W -n app.timeguard/.MainActivity --es demo home
            sleep 5
            adb exec-out screencap -p > shots/1-home.png
            adb shell am force-stop app.timeguard
            adb shell am start -W -n app.timeguard/.MainActivity --es demo alert
            sleep 4
            adb exec-out screencap -p > shots/2-using.png
            adb shell am force-stop app.timeguard
            adb shell am start -W -n app.timeguard/.MainActivity --es demo block --ei seed 1
            sleep 4
            adb exec-out screencap -p > shots/3-limit.png
            adb shell am force-stop app.timeguard
            adb shell am start -W -n app.timeguard/.MainActivity --es demo block --ei seed 3
            sleep 4
            adb exec-out screencap -p > shots/4-limit-2.png

      - uses: actions/upload-artifact@v4
        with:
          name: timeguard-screenshots
          path: shots/

      # 폰에서 바로 받을 수 있는 고정 링크. PR 빌드는 시험판, main은 정식 링크로 올린다.
      - name: 다운로드 링크 갱신
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then TAG=timeguard-latest; TITLE="시간 지킴이"; PRE=""; else TAG=timeguard-test; TITLE="시간 지킴이 (시험판)"; PRE="--prerelease"; fi
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
          gh release create "$TAG" timeguard.apk shots/*.png --repo "$REPO" --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "폰에서 timeguard.apk를 눌러 설치하세요. 화면 캡처의 숫자는 예시입니다. (커밋 ${GITHUB_SHA::7})" \
            --latest=false $PRE
