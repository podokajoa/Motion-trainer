<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모션 트레이너</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#0f1115; --fg:#f2f4f8; --muted:#9aa3b2; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --in:#60a5fa; --out:#fb923c; --card:#1a1d24; --line:#2a303b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  button, select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:15px; }
  button.primary { background:var(--good); color:#0b1a10; border:none; font-weight:700; }
  #guide { color:var(--muted); font-size:14px; margin:6px 0 10px; line-height:1.5; }
  .stage { position:relative; width:100%; aspect-ratio:3/4; max-height:75vh; background:#000; border-radius:14px; overflow:hidden; }
  @media (min-aspect-ratio:1/1) { .stage { aspect-ratio:4/3; } }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .hud { position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; }
  .pill { background:rgba(0,0,0,.62); border-radius:12px; padding:8px 12px; }
  .count { font-size:44px; font-weight:800; line-height:1; }
  .label { font-size:12px; color:var(--muted); }
  #breath { font-size:26px; font-weight:800; text-align:center; min-width:96px; transition:color .2s; }
  #breathBar { height:6px; border-radius:3px; background:var(--line); margin-top:6px; overflow:hidden; }
  #breathFill { height:100%; width:0; background:currentColor; transition:width .25s; }
  .cue { position:absolute; left:10px; right:10px; bottom:10px; background:rgba(0,0,0,.72); border-radius:12px; padding:12px 14px; font-size:20px; font-weight:800; text-align:center; pointer-events:none; }
  .cue small { display:block; font-size:13px; font-weight:500; color:var(--muted); margin-top:4px; }
  #reps { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .rep { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; }
  .rep.ok { border-color:var(--good); }
  .rep.bad { border-color:var(--warn); }
  #summary { margin-top:12px; font-size:14px; line-height:1.6; color:var(--muted); }
  #status { color:var(--muted); font-size:13px; margin:4px 0; }
  #ana { position:absolute; inset:0; z-index:5; background:var(--bg); overflow:auto; padding:12px; }
  .ana-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:18px; }
  .rp { position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:10px; overflow:hidden; }
  .rp video, .rp canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .ana-ctrl { display:flex; gap:6px; align-items:center; margin:8px 0; }
  .ana-ctrl button { padding:6px 10px; font-size:13px; }
  .ana-ctrl button.on { border-color:var(--good); color:var(--good); }
  #anaSummary { font-size:15px; line-height:1.6; margin:6px 0 10px; }
  #anaSummary b { color:var(--warn); }
  .ana-rep { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:6px; font-size:14px; line-height:1.5; cursor:pointer; }
  .ana-rep.ok { border-color:var(--good); }
  .ana-rep.bad { border-color:var(--warn); }
  .ana-rep small { display:block; color:var(--muted); }
  body.workout #ana { font-size:4vmin; }
  #history { margin-top:28px; border-top:1px solid var(--line); padding-top:16px; }
  #history h2 { font-size:18px; margin:0 0 10px; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-width:96px; }
  .stat b { display:block; font-size:22px; }
  .stat span { font-size:12px; color:var(--muted); }
  #histChart { display:flex; align-items:flex-end; gap:6px; height:120px; margin-bottom:16px; }
  .bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; font-size:11px; color:var(--muted); gap:4px; }
  .bar i { display:block; width:100%; max-width:36px; background:var(--good); border-radius:6px 6px 2px 2px; min-height:2px; }
  .bar.today i { background:var(--in); }
  .hist-item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:14px; line-height:1.5; }
  .hist-item small { color:var(--muted); display:block; }
  #histClear { margin-top:10px; font-size:13px; color:var(--muted); }
  #zoomWrap { display:none; align-items:center; gap:8px; color:var(--muted); font-size:14px; }
  #exit { display:none; }
  .flash { position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 0 transparent; transition:box-shadow .25s; }
  /* 운동 모드: 멀리서도 보이게 전체화면 + 큰 글씨 + 테두리 색으로 상태 표시 */
  body.workout main > :not(.stage) { display:none; }
  body.workout main { padding:0; max-width:none; }
  body.workout .stage { position:fixed; inset:0; width:100vw; height:100vh; max-height:none; aspect-ratio:auto; border-radius:0; }
  body.workout .flash { box-shadow:inset 0 0 0 2.5vmin var(--state, transparent); }
  body.workout .pill { padding:1.5vmin 2.5vmin; border-radius:2vmin; }
  body.workout .label { font-size:3vmin; }
  body.workout .count { font-size:22vmin; }
  body.workout #breath { font-size:10vmin; min-width:30vmin; }
  body.workout #breathBar { height:1.5vmin; }
  body.workout #view { font-size:4vmin; }
  body.workout .cue { font-size:8vmin; line-height:1.2; padding:2.5vmin 3vmin; bottom:4vmin; left:4vmin; right:4vmin; border-radius:3vmin; }
  body.workout .cue small { font-size:4vmin; }
  body.workout #exit { display:block; position:absolute; right:3vmin; bottom:calc(4vmin + 30vmin); font-size:4vmin; padding:1.5vmin 3vmin; opacity:.85; }
  body.workout .hud { top:3vmin; left:3vmin; right:3vmin; }
</style>
</head>
<body>
<main>
  <h1>모션 트레이너</h1>
  <div style="margin:-6px 0 10px;font-size:14px"><a href="smile/" style="color:#f472b6">😊 미소 트레이너 (입꼬리 웃음 연습)</a></div>
  <div style="margin:-6px 0 10px;font-size:14px"><a href="decide/" style="color:#a7d9a2">🌾 갈대 탈출 (결정 도우미)</a></div>
  <div class="controls">
    <select id="exercise">
      <option value="squat">스쿼트</option>
      <option value="lunge">런지</option>
      <option value="pushup">푸시업</option>
      <option value="plank">플랭크</option>
      <option value="curl">덤벨 컬</option>
      <optgroup label="케틀벨">
        <option value="kbgoblet">고블릿 스쿼트</option>
        <option value="kbdeadlift">케틀벨 데드리프트</option>
        <option value="kbswing">케틀벨 스윙 (녹화 분석)</option>
      </optgroup>
    </select>
    <button id="start" class="primary">카메라 시작</button>
    <select id="cam"><option value="">카메라: 전면</option></select>
    <button id="reset">초기화</button>
    <button id="voice">음성: 켜짐</button>
    <button id="breathVoice">호흡: 신호음</button>
    <label id="zoomWrap">줌 <input type="range" id="zoom" step="0.1"> <span id="zoomVal"></span></label>
  </div>
  <div id="guide"></div>
  <div id="camHint" style="color:var(--muted);font-size:13px;margin-bottom:6px">0.6배 광각은 보통 후면 카메라 중 하나예요. 카메라 목록에서 바꿔가며 가장 넓게 보이는 걸 고르세요. 고른 카메라는 기억해 둬요.</div>
  <div id="status">버튼을 누르면 카메라 권한을 요청합니다. 영상은 기기 밖으로 전송되지 않아요.</div>
  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="flash" id="flash"></div>
    <button id="exit">■ 그만하기</button>
    <div class="hud">
      <div class="pill"><div class="label" id="countLabel">횟수</div><div class="count" id="count">0</div></div>
      <div class="pill" id="breathBox" style="color:var(--muted)"><div class="label">호흡</div><div id="breath">-</div><div id="breathBar"><div id="breathFill"></div></div></div>
      <div class="pill" style="text-align:right"><div class="label">카메라 방향</div><div id="view" style="font-weight:700">-</div><div class="label" id="angle"></div></div>
    </div>
    <div id="ana" hidden>
      <div class="ana-head"><b id="anaTitle">스윙 분석</b><button id="anaClose">다시 하기</button></div>
      <div class="rp"><video id="rv" playsinline muted loop></video><canvas id="rc"></canvas></div>
      <div class="ana-ctrl"><span class="label">재생 속도</span>
        <button data-rate="1">1배</button><button data-rate="0.5" class="on">0.5배</button><button data-rate="0.25">0.25배</button></div>
      <div id="anaSummary"></div>
      <div id="anaReps"></div>
    </div>
    <div class="cue" id="cue">준비되면 시작하세요<small>몸 전체가 화면에 들어오게 서주세요</small></div>
  </div>
  <div id="reps"></div>
  <div id="summary"></div>
  <section id="history">
    <h2>운동 기록</h2>
    <div class="stats" id="histStats"></div>
    <div class="label" style="margin-bottom:6px">최근 7일 (횟수)</div>
    <div id="histChart"></div>
    <div id="histList"></div>
    <button id="histClear">기록 전체 삭제</button>
  </section>
</main>
<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
let landmarker, stream, running = false;
let voiceOn = true, breathMode = "tone"; // tone | voice | off
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
breathMode = store.get("breathMode") || "tone";

// ---------- 기하 계산 (픽셀 좌표 기준, y는 아래로 증가) ----------
let W = 640, H = 480;
const P = (lm, i) => ({ x: lm[i].x * W, y: lm[i].y * H, v: lm[i].visibility ?? 0 });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
function angle(a, b, c) {
  const r = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
  const d = Math.abs(r * 180 / Math.PI);
  return d > 180 ? 360 - d : d;
}
// 선분 a→b가 수직선에서 기운 각도 (0 = 똑바로 섬)
const leanFromVertical = (bottom, top) => Math.abs(Math.atan2(top.x - bottom.x, bottom.y - top.y) * 180 / Math.PI);
// 점 p가 a-b 직선에서 아래(+)/위(-)로 벗어난 정도
function offLine(p, a, b) {
  if (Math.abs(b.x - a.x) < 1) return 0;
  const t = (p.x - a.x) / (b.x - a.x);
  return p.y - (a.y + t * (b.y - a.y));
}

const SIDES = {
  L: { sh: 11, el: 13, wr: 15, hip: 23, kn: 25, an: 27, heel: 29, toe: 31, ear: 7 },
  R: { sh: 12, el: 14, wr: 16, hip: 24, kn: 26, an: 28, heel: 30, toe: 32, ear: 8 },
};
function pickSide(lm, keys) {
  const score = s => keys.reduce((t, k) => t + (lm[SIDES[s][k]].visibility ?? 0), 0) / keys.length;
  const l = score("L"), r = score("R");
  return l >= r ? { s: SIDES.L, o: SIDES.R, vis: l } : { s: SIDES.R, o: SIDES.L, vis: r };
}
function detectView(lm) {
  const shW = dist(P(lm, 11), P(lm, 12));
  const torso = dist(mid(P(lm, 11), P(lm, 12)), mid(P(lm, 23), P(lm, 24)));
  if (torso < 1) return "unknown";
  const r = shW / torso;
  return r > 0.55 ? "front" : r < 0.35 ? "side" : "diag";
}
// 몸 전체가 서 있는지(upright) 엎드려 있는지(horizontal): 어깨 중심→발목 중심 선의 기울기로 판단
// 3D 좌표(worldLandmarks, 미터 단위)가 있으면 그걸 우선 사용: 폰이 정면에 있으면
// 엎드린 몸도 화면상으로는 세로로 보이기 때문. 카메라는 세워져 있다고 가정(y축 ≈ 중력 방향).
function verticalRatio(wl, top, bottom) {
  const a = { x: (wl[top[0]].x + wl[top[1]].x) / 2, y: (wl[top[0]].y + wl[top[1]].y) / 2, z: (wl[top[0]].z + wl[top[1]].z) / 2 };
  const b = { x: (wl[bottom[0]].x + wl[bottom[1]].x) / 2, y: (wl[bottom[0]].y + wl[bottom[1]].y) / 2, z: (wl[bottom[0]].z + wl[bottom[1]].z) / 2 };
  const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
  return Math.abs(dy) / (Math.hypot(dx, dy, dz) || 1);
}
// hinge: 데드리프트/스윙처럼 상체를 크게 숙이는 운동은 다리(어깨→발목) 기울기만 봄
function bodyPosture(lm, wl, hinge) {
  if (wl) {
    const legs = verticalRatio(wl, [11, 12], [27, 28]), torso = verticalRatio(wl, [11, 12], [23, 24]);
    if (hinge) return legs < 0.5 ? "horizontal" : legs > 0.7 ? "upright" : "mid";
    if (legs < 0.5 || torso < 0.4) return "horizontal";
    if (legs > 0.7 && torso > 0.55) return "upright";
    return "mid";
  }
  const sh = mid(P(lm, 11), P(lm, 12)), an = mid(P(lm, 27), P(lm, 28));
  const a = Math.atan2(Math.abs(an.y - sh.y), Math.abs(an.x - sh.x)) * 180 / Math.PI;
  return a > 55 ? "upright" : a < 35 ? "horizontal" : "mid";
}
const VIEW_KO = { front: "정면", side: "측면", diag: "대각선", unknown: "-" };

// ---------- 운동 정의 ----------
// metric: 동작 진행을 나타내는 관절 각도. 각도가 down 아래로 내려갔다가 up 위로 올라오면 1회.
// lowerIsInhale: 각도가 줄어드는 구간이 들숨이면 true (스쿼트/푸시업은 내려갈 때 들숨).
const EX = {
  squat: {
    name: "스쿼트", posture: "upright", legs: true, view: "측면(등, 깊이) 또는 정면(무릎 방향)", down: 100, up: 160, depth: 95, lowerIsInhale: true,
    keys: ["hip", "kn", "an"],
    metric: (lm, sd) => angle(P(lm, sd.s.hip), P(lm, sd.s.kn), P(lm, sd.s.an)),
    coach: "발은 어깨너비, 무릎을 바깥쪽으로 벌리며 앉으세요",
    cues: { down: ["무릎을 바깥쪽으로 계속 밀어주세요", "엉덩이를 뒤로 빼면서 앉으세요", "가슴을 펴고 등을 곧게"], up: ["뒤꿈치로 바닥을 밀며 일어나세요", "일어나면서 엉덩이를 조이세요", "무릎이 안으로 모이지 않게"] },
    checks(lm, sd, view, ang) {
      const out = [];
      const s = sd.s, hip = P(lm, s.hip), kn = P(lm, s.kn), an = P(lm, s.an), sh = P(lm, s.sh);
      const leg = dist(hip, kn) + dist(kn, an);
      if (view === "front" || view === "diag") {
        const kL = P(lm, 25), kR = P(lm, 26), aL = P(lm, 27), aR = P(lm, 28), sL = P(lm, 11), sR = P(lm, 12);
        const kneeW = Math.abs(kL.x - kR.x), ankleW = Math.abs(aL.x - aR.x), shW = Math.abs(sL.x - sR.x);
        if (ang < 150 && kneeW < ankleW * 0.9) out.push({ k: "valgus", m: "무릎이 안으로 모여요! 바깥쪽으로 벌리세요", sev: 3 });
        if (ang > 150 && ankleW < shW * 0.75) out.push({ k: "stance", m: "발을 어깨너비로 벌려주세요", sev: 1 });
        const hipTilt = Math.abs(P(lm, 23).y - P(lm, 24).y) / shW;
        if (ang < 140 && hipTilt > 0.18) out.push({ k: "shift", m: "체중을 양발에 고르게 실으세요", sev: 2 });
      }
      if (view === "side" || view === "diag") {
        const lean = leanFromVertical(hip, sh);
        if (lean > 50) out.push({ k: "lean", m: "가슴을 펴고 등을 곧게 세우세요", sev: 3 });
        const toe = P(lm, s.toe), heel = P(lm, s.heel);
        const dir = Math.sign(toe.x - heel.x) || 1;
        if (ang < 130 && (kn.x - toe.x) * dir > leg * 0.12) out.push({ k: "knee_fwd", m: "엉덩이를 뒤로 빼면서 앉으세요", sev: 2 });
        if (ang < 130 && heel.y < toe.y - leg * 0.05) out.push({ k: "heel", m: "뒤꿈치를 바닥에 붙이세요", sev: 2 });
        const ear = P(lm, s.ear);
        if (leanFromVertical(sh, ear) - lean > 35) out.push({ k: "neck", m: "고개를 숙이지 말고 시선은 정면", sev: 1 });
      }
      return out;
    },
    repEnd: (minAng) => minAng > 105 ? [{ k: "depth", m: "조금 더 깊게 앉아보세요" }] : [],
  },
  lunge: {
    name: "런지", posture: "upright", legs: true, view: "측면", down: 105, up: 155, depth: 100, lowerIsInhale: true,
    keys: ["hip", "kn", "an"],
    // 더 많이 굽혀진 무릎을 앞다리로 봄
    metric: (lm) => Math.min(angle(P(lm, 23), P(lm, 25), P(lm, 27)), angle(P(lm, 24), P(lm, 26), P(lm, 28))),
    coach: "상체는 세우고, 앞무릎과 뒷무릎 모두 90도까지",
    cues: { down: ["상체를 세운 채 수직으로 내려가세요", "앞무릎은 발끝 방향으로"], up: ["앞발 뒤꿈치로 밀어 올라오세요", "복부에 힘을 유지하세요"] },
    checks(lm, sd, view, ang) {
      const out = [];
      const L = angle(P(lm, 23), P(lm, 25), P(lm, 27)), R = angle(P(lm, 24), P(lm, 26), P(lm, 28));
      const f = L < R ? SIDES.L : SIDES.R;
      const hip = P(lm, f.hip), kn = P(lm, f.kn), an = P(lm, f.an), sh = P(lm, f.sh), toe = P(lm, f.toe), heel = P(lm, f.heel);
      const leg = dist(hip, kn) + dist(kn, an);
      if (leanFromVertical(hip, sh) > 25) out.push({ k: "lean", m: "상체를 똑바로 세우세요", sev: 3 });
      const dir = Math.sign(toe.x - heel.x) || 1;
      if (ang < 130 && (kn.x - toe.x) * dir > leg * 0.08) out.push({ k: "knee_fwd", m: "앞무릎이 너무 나갔어요, 보폭을 넓히세요", sev: 2 });
      if (view === "front") {

// 옆에서 본 몸의 방향(+1: 화면 오른쪽을 봄)과, 상체가 앞(+)/뒤(-)로 기운 각도
function facingDir(lm, s) { return Math.sign(P(lm, s.toe).x - P(lm, s.heel).x) || 1; }
function signedLean(lm, s) {
  const sh = P(lm, s.sh), hip = P(lm, s.hip);
  return Math.atan2((sh.x - hip.x) * facingDir(lm, s), hip.y - sh.y) * 180 / Math.PI;
}

// ---------- 스윙: 자동 녹화 + 세트 후 분석 ----------
// 실시간으로는 말하지 않고(집중 방해), 관절 위치를 저장해 두었다가 세트가 끝나면 분석.
const SW = { mode: "wait", frames: [], recStart: 0, lastMotion: 0, lastSeen: 0, recorder: null, chunks: [], liveReps: 0, livePhase: "up", url: null, result: null };
function resetSwing() {
  if (SW.recorder?.state === "recording") SW.recorder.stop();
  Object.assign(SW, { mode: "wait", frames: [], recorder: null, chunks: [], liveReps: 0, livePhase: "up", result: null });
  $("ana").hidden = true;
}
// 고관절 각도(180 = 똑바로 섬, 180 미만 = 접힘, 180 초과 = 뒤로 젖힘).
// 일반 각도는 뒤로 젖혀도 180 미만으로 접혀 보여서 정점을 놓치므로 방향을 구분함.
function hipAngle(lm, s) {
  const sh = P(lm, s.sh), hip = P(lm, s.hip), kn = P(lm, s.kn);
  const a = angle(sh, hip, kn);
  const cross = (sh.x - hip.x) * (kn.y - hip.y) - (sh.y - hip.y) * (kn.x - hip.x);
  return cross * facingDir(lm, s) >= 0 ? a : 360 - a;
}

function processSwing(lm, t, sd, view) {
  if (SW.mode === "done") return;
  const hipA = hipAngle(lm, sd.s);
  SW.lastSeen = t;
  $("angle").textContent = `엉덩이 각도 ${Math.round(hipA)}°`;
  if (SW.mode === "wait") {
    $("count").textContent = "대기";
    if (view === "front") setCue("옆에서 찍어주세요", "스윙은 측면에서만 정확하게 분석돼요", "var(--warn)");
    else setCue("준비 완료", "스윙을 시작하면 자동으로 녹화돼요", "var(--fg)");
    if (hipA < 125) startSwingRec(t);
    else return;
  }
  // 녹화 중: 프레임 저장, 화면에는 회수만 크게
  SW.frames.push({ t: t - SW.recStart, lm: lm.map(p => ({ x: p.x, y: p.y, visibility: p.visibility })) });
  if (hipA < 150) SW.lastMotion = t;
  if (SW.livePhase === "up" && hipA < 120) SW.livePhase = "down";
  if (SW.livePhase === "down" && hipA > 160) {
    SW.livePhase = "up"; SW.liveReps++;
    if (breathMode !== "off") tone(false); // 정점 = 날숨 신호
  }
  const sec = Math.floor((t - SW.recStart) / 1000);
  $("count").textContent = SW.liveReps;
  setCue(`● 녹화 중 ${sec}초`, "끝나면 벨을 내려놓고 똑바로 서 계세요", "var(--bad)");
  const standingStill = hipA > 165 && t - SW.lastMotion > 2500;
  if (standingStill || t - SW.recStart > 60000) finishSwing();
}
function swingTick(now) { if (SW.mode === "rec" && now - SW.lastSeen > 3000) finishSwing(); }

function startSwingRec(t) {
  SW.mode = "rec"; SW.frames = []; SW.recStart = t; SW.lastMotion = t; SW.liveReps = 0; SW.livePhase = "down"; SW.chunks = [];
  tone(true);
  try {
    const type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(m => MediaRecorder.isTypeSupported?.(m));
    SW.recorder = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 2_500_000 } : undefined);
    SW.recorder.ondataavailable = e => e.data.size && SW.chunks.push(e.data);
    SW.recorder.start(500);
  } catch { SW.recorder = null; }
}

function finishSwing() {
  if (SW.mode !== "rec") return;
  SW.mode = "done";
  const r = analyzeSwing(SW.frames);
  SW.result = r;
  const done = () => showSwingResult(r);
  if (SW.recorder && SW.recorder.state !== "inactive") {
    SW.recorder.onstop = () => {
      if (SW.url) URL.revokeObjectURL(SW.url);
      SW.url = SW.chunks.length ? URL.createObjectURL(new Blob(SW.chunks, { type: SW.recorder.mimeType || "video/webm" })) : null;
      done();
    };
    SW.recorder.stop();
  } else { SW.url = null; done(); }
}

const SWING_MSG = {
  squat: "무릎을 너무 굽혀요. 무릎은 살짝만, 엉덩이를 뒤로 접으세요",
  shallow: "엉덩이를 더 깊게 뒤로 접으세요",
  low: "벨이 무릎 아래로 떨어져요. 사타구니 높이로 높게 하이크하세요",
  lockout: "정점에서 엉덩이를 끝까지 펴세요",
  kneeTop: "정점에서 무릎도 쭉 펴세요",
  leanback: "정점에서 상체를 뒤로 젖히지 마세요. 몸은 일직선으로",
  high: "벨이 너무 높아요. 어깨 높이까지만 띄우세요",
  weak: "엉덩이를 더 세게 밀어 벨을 가슴 높이까지 띄우세요",
};

function analyzeSwing(frames) {
  if (frames.length < 10) return { reps: [] };
  const side = pickSide(frames[Math.floor(frames.length / 2)].lm, ["sh", "hip", "kn", "an"]).s;
  let ema = null;
  const series = frames.map(f => {
    const h = hipAngle(f.lm, side);
    ema = ema == null ? h : ema * 0.5 + h * 0.5;
    return { t: f.t, lm: f.lm, hip: ema, raw: h, lean: signedLean(f.lm, side) };
  });
  // 회차 나누기(평활화한 각도 사용): 엉덩이 각도가 120° 아래(하이크) → 160° 위(정점)로 가면 1회.
  // 측정값은 평활화 전 원래 값으로: 정점이 짧게 지나가도 놓치지 않게.
  const reps = []; let cur = null, phase = "up";
  for (let i = 0; i < series.length; i++) {
    const f = series[i];
    if (phase === "up" && f.hip < 120) {
      if (cur?.top) reps.push(cur);
      cur = { bottom: f, top: null, start: f.t }; phase = "down";
    } else if (phase === "down") {
      if (f.raw < cur.bottom.raw) cur.bottom = f;
      if (f.hip > 160) { phase = "up"; cur.top = f; cur.peak = f; cur.back = f; }
    }
    if (phase === "up" && cur?.top) {
      if (f.raw > cur.top.raw) cur.top = f;
      if (f.lean < cur.back.lean) cur.back = f; // 가장 뒤로 젖혀진 순간
      if (P(f.lm, side.wr).y < P(cur.peak.lm, side.wr).y) cur.peak = f; // 벨이 가장 높이 뜬 순간
    }
  }
  if (cur?.top) reps.push(cur);

  return { side, series, reps: reps.map((r, idx) => {
    const issues = [];
    const b = r.bottom.lm, tp = r.top.lm, s = side;
    const kneeB = angle(P(b, s.hip), P(b, s.kn), P(b, s.an));
    const shin = dist(P(b, s.kn), P(b, s.an)), torso = dist(P(tp, s.sh), P(tp, s.hip));
    if (kneeB < 120) issues.push("squat");
    else if (r.bottom.raw > 125) issues.push("shallow");
    if (idx > 0 && P(b, s.wr).y > P(b, s.kn).y + shin * 0.25) issues.push("low"); // 첫 회는 바닥에서 들어올리는 동작이라 제외
    const leanBack = r.back.lean < -12;
    if (leanBack) issues.push("leanback");
    else if (r.top.raw < 165) issues.push("lockout"); // 뒤로 젖히면 각도가 접혀 보이므로 그때는 락아웃 판정 생략
    if (angle(P(tp, s.hip), P(tp, s.kn), P(tp, s.an)) < 160) issues.push("kneeTop");
    const pk = r.peak.lm, wrY = P(pk, s.wr).y, shY = P(pk, s.sh).y;
    if (wrY < shY - torso * 0.25) issues.push("high");
    else if (wrY > shY + torso * 0.5) issues.push("weak");
    return { n: idx + 1, t: r.start, tb: r.bottom.t, issues, hipMin: Math.round(r.bottom.raw), hipMax: Math.min(180, Math.round(r.top.raw)), kneeB: Math.round(kneeB) };
  }) };
}

function showSwingResult(r) {
  const reps = r.reps;
  const tally = {};
  for (const rp of reps) for (const k of rp.issues) tally[k] = (tally[k] || 0) + 1;
  const top = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  const clean = reps.filter(rp => !rp.issues.length).length;

  // 기록에 합산
  for (const rp of reps) {
    S.count++; S.reps.push(rp.issues.map(k => SWING_MSG[k]));
    for (const k of rp.issues) { S.issueTally[k] = (S.issueTally[k] || 0) + 1; S.msgs[k] = SWING_MSG[k]; }
  }
  if (reps.length) saveSession();

  $("anaTitle").textContent = `스윙 ${reps.length}회 분석`;
  const sum = $("anaSummary"); sum.innerHTML = "";
  if (!reps.length) sum.textContent = "스윙 동작을 찾지 못했어요. 옆에서 몸 전체가 보이게 찍어주세요.";
  else {
    sum.append(`바른 자세 ${clean}/${reps.length}회. `);
    if (top.length) {
      sum.append("가장 많이 나온 교정: ");
      top.slice(0, 2).forEach(([k, n], i) => { const b = document.createElement("b"); b.textContent = `${SWING_MSG[k]} (${n}회)`; sum.append(i ? " / " : "", b); });
    } else sum.append("아주 좋아요! 지금 리듬 그대로 가세요.");
  }
  const list = $("anaReps"); list.innerHTML = "";
  for (const rp of reps) {
    const el = document.createElement("div");
    el.className = "ana-rep " + (rp.issues.length ? "bad" : "ok");
    el.append(`${rp.n}회 · ${rp.issues.length ? rp.issues.length + "개 교정" : "완벽"}`);
    const sm = document.createElement("small");
    sm.textContent = (rp.issues.length ? rp.issues.map(k => SWING_MSG[k]).join(" / ") + " · " : "") + `엉덩이 ${rp.hipMin}°→${rp.hipMax}°, 하이크 때 무릎 ${rp.kneeB}°`;
    el.append(sm);
    el.onclick = () => seekReplay(rp.t / 1000 - 0.3);
    list.append(el);
  }
  $("ana").hidden = false;
  setupReplay(r);
  // 음성 요약: 핵심 교정 2개까지만
  const say = !reps.length ? "스윙을 찾지 못했어요. 옆에서 찍어주세요."
    : `스윙 ${reps.length}회. ` + (top.length ? top.slice(0, 2).map(([k]) => SWING_MSG[k]).join(". ") : "아주 좋아요.");
  speak(say, 3);
}

// 리플레이: 녹화 영상 위에 저장한 관절을 시간에 맞춰 그림. 교정이 있는 회차는 빨간 뼈대.
let replayRAF = 0;
function setupReplay(r) {
  const rv = $("rv"), rc = $("rc"), rctx = rc.getContext("2d"), rdraw = new DrawingUtils(rctx);
  cancelAnimationFrame(replayRAF);
  const mirror = video.style.transform;
  rv.style.transform = rc.style.transform = mirror;
  rc.width = W; rc.height = H;
  const frames = SW.frames;
  const badAt = t => r.reps.find(rp => t >= rp.t - 200 && t <= (r.reps[rp.n]?.t ?? Infinity))?.issues.length > 0;
  let fallbackStart = performance.now();
  const frameAt = ms => { let lo = 0, hi = frames.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (frames[m].t < ms) lo = m + 1; else hi = m; } return frames[lo]; };
  const paint = () => {
    rctx.clearRect(0, 0, rc.width, rc.height);
    let ms;
    if (SW.url) ms = rv.currentTime * 1000;
    else { // 영상 녹화가 안 되는 기기: 뼈대만 0.5배속으로 재생
      const dur = frames.at(-1)?.t || 1;
      ms = ((performance.now() - fallbackStart) * 0.5) % dur;
      rctx.fillStyle = "#000"; rctx.fillRect(0, 0, rc.width, rc.height);
    }
    const f = frames.length && frameAt(ms);
    if (f) {

// ---------- 상태 ----------
const S = {};
function resetState() {
  Object.assign(S, { count: 0, phase: "up", minAng: 180, maxAng: 0, repIssues: new Map(), reps: [], ang: null, prevAng: null,
    breath: null, breathSince: 0, holdMs: 0, holdBad: 0, lastT: 0, baseLean: null, issueTally: {}, msgs: {}, dir: null, issueFrames: {}, cueIdx: 0, lastCoachAt: 0, lastHoldCue: 0, sid: Date.now(), lastSaveSec: 0 });
  $("count").textContent = "0"; $("reps").innerHTML = ""; $("summary").textContent = "";
  const ex = EX[$("exercise").value];
  $("countLabel").textContent = ex.hold ? "유지 시간" : "횟수";

// ---------- 음성 ----------
// 우선순위: 3 횟수 > 2 자세 교정 > 1 코칭 멘트 > 0 호흡. 호흡은 기본적으로 말 대신 짧은 신호음.
let lastSpeakAt = 0, lastPrio = 0; const lastCueAt = {};
function speak(text, prio, key) {
  if (!voiceOn || !("speechSynthesis" in window)) return false;
  const now = performance.now();
  if (key && now - (lastCueAt[key] || 0) < 5000) return false;
  const busy = speechSynthesis.speaking || speechSynthesis.pending;
  if (prio < 3 && busy && lastPrio >= prio) return false;
  if (prio <= 1 && now - lastSpeakAt < 1500) return false;
  if (prio === 2 && busy) speechSynthesis.cancel();
  if (key) lastCueAt[key] = now;
  lastSpeakAt = now; lastPrio = prio;
  const u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; u.rate = 1.1;
  speechSynthesis.speak(u);
  return true;
}

let audioCtx;
function tone(rising) {
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = "sine";
    o.frequency.setValueAtTime(rising ? 330 : 560, t);
    o.frequency.linearRampToValueAtTime(rising ? 520 : 340, t + 0.35);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.45);
  } catch {}
}

function setState(color) { $("flash").style.setProperty("--state", color); }

function setCue(main, sub, color) {
  const c = $("cue");
  c.innerHTML = ""; c.append(main);
  if (sub) { const sm = document.createElement("small"); sm.textContent = sub; c.append(sm); }
  c.style.color = color;
  setState(color);
}

function setBreath(kind) {
  const box = $("breathBox");
  if (kind === S.breath) return;
  S.breath = kind; S.breathSince = performance.now();
  $("breath").textContent = kind === "in" ? "들숨" : kind === "out" ? "날숨" : "-";
  box.style.color = kind === "in" ? "var(--in)" : kind === "out" ? "var(--out)" : "var(--muted)";
  if (!kind || breathMode === "off") return;
  if (breathMode === "tone") tone(kind === "in");
  else speak(kind === "in" ? "들숨" : "날숨", 0);
}

// ---------- 매 프레임 처리 ----------
function process(lm, t, wl) {
  const exKey = $("exercise").value, ex = EX[exKey];
  const sd = pickSide(lm, ex.keys);
  const view = detectView(lm);
  $("view").textContent = VIEW_KO[view];
  if (sd.vis < 0.5) { setCue("몸 전체가 보이게 서주세요", "카메라에서 2~3m 떨어지면 좋아요", "var(--muted)"); return; }
  const dt = S.lastT ? Math.min(t - S.lastT, 100) : 0; S.lastT = t;
  if (ex.analyze) return processSwing(lm, t, sd, view);

  // 운동에 맞지 않는 몸 자세(예: 스쿼트 중 엎드림)면 세지 않고 진행 중인 1회도 취소
  const pst = bodyPosture(lm, wl, ex.hinge);
  S.wrongPosture = pst !== ex.posture && pst !== "mid" ? (S.wrongPosture || 0) + 1 : 0;
  if (S.wrongPosture >= 5) {
    S.phase = "up"; S.repIssues.clear(); S.dir = null; S.lastT = 0; S.standFrames = 0; S.ready = false;
    const hint = ex.posture === "upright" ? "선 자세에서 해주세요" : "엎드린 자세에서 해주세요";
    setCue(`${ex.name} 자세가 아니에요`, hint, "var(--muted)");
    speak(`${ex.name} 자세가 아니에요. ${hint}`, 2, "posture");
    return;
  }

  const found = ex.checks(lm, sd, view, S.ang ?? 180).sort((a, b) => b.sev - a.sev);
  // 순간적인 인식 흔들림은 무시: 같은 문제가 6프레임 이상 이어질 때만 교정
  const seen = new Set(found.map(i => i.k));
  for (const k of Object.keys(S.issueFrames)) if (!seen.has(k)) delete S.issueFrames[k];
  for (const k of seen) S.issueFrames[k] = (S.issueFrames[k] || 0) + 1;
  const issues = found.filter(i => S.issueFrames[i.k] >= 6);

  if (ex.hold) return processHold(ex, issues, dt);

  // 각도 평활화(EMA)로 떨림 줄이기
  const raw = ex.metric(lm, sd);
  S.prevAng = S.ang;
  S.ang = S.ang == null ? raw : S.ang * 0.6 + raw * 0.4;
  const ang = S.ang;
  $("angle").textContent = `관절 각도 ${Math.round(ang)}°`;

  // 호흡: 각도 변화 방향으로 판단
  if (S.prevAng != null) {
    const v = (ang - S.prevAng) / Math.max(dt, 1) * 1000; // 초당 각도 변화
    if (Math.abs(v) > 25) {
      const lowering = v < 0;
      setBreath(lowering === ex.lowerIsInhale ? "in" : "out");
      const dir = lowering ? "down" : "up";
      if (dir !== S.dir) { S.dir = dir; if (!issues.length) coach(ex, dir, t); }
    }
  }
  const lo = ex.down, hi = ex.up;
  $("breathFill").style.width = `${Math.max(0, Math.min(100, (hi - ang) / (hi - lo) * 100))}%`;

  // 동작 단계
  // 1회는 반드시 "바른 시작 자세"(스쿼트면 똑바로 선 자세)에서 출발해야 함.
  // 바닥에서 일어나는 동작이나 플랭크에서 돌아오는 동작이 1회로 세지지 않게 함.
  if (S.phase === "up") {
    S.standFrames = ang > hi - 5 && pst === ex.posture ? (S.standFrames || 0) + 1 : 0;
    if (S.standFrames >= 5) S.ready = true;
    if (pst !== ex.posture && pst !== "mid") S.ready = false;
  }
  if (S.phase === "up" && ang < hi - 15 && S.ready) {
    S.phase = "moving"; S.minAng = ang; S.maxAng = ang; S.repIssues.clear();
    S.repStart = t; S.badFrames = 0; S.repInvalid = null; S.ready = false;
  }
  // 동작 중에 엎드리거나 손을 바닥에 짚으면 이번 회는 무효
  if (S.phase !== "up" && ex.posture === "upright") {
    let reason = null;
    if (pst !== "upright") reason = "몸이 앞으로 엎드려졌어요";
    if (ex.legs) {
      const kn = P(lm, sd.s.kn), an = P(lm, sd.s.an), shin = dist(kn, an);
      const wr = [P(lm, 15), P(lm, 16)].filter(w => w.v > 0.5);
      if (wr.some(w => w.y > Math.max(P(lm, 25).y, P(lm, 26).y) + shin * 0.3)) reason = "손을 바닥에 짚었어요";
    }
    S.badFrames = reason ? (S.badFrames || 0) + 1 : 0;
    if (S.badFrames >= 3) S.repInvalid = reason;
    if (t - S.repStart > 8000) S.repInvalid = "한 번 하는 데 너무 오래 걸렸어요";
  }
  if (S.phase !== "up") { S.minAng = Math.min(S.minAng, ang); S.maxAng = Math.max(S.maxAng, ang); }
  if (S.phase === "moving" && ang < ex.down) S.phase = "bottom";
  if (S.phase !== "up") for (const i of issues) S.repIssues.set(i.k, i.m);

  if (S.phase === "bottom" && ang > hi) completeRep(ex);
  else if (S.phase === "moving" && ang > hi) S.phase = "up"; // 덜 내려가고 돌아온 경우
  if (S.phase === "up") S.maxAng = Math.max(S.maxAng, ang);

  if (t < (S.cueHold || 0)) return; // "세지 않았어요" 안내를 잠시 유지
  if (issues.length) {
    setCue(issues[0].m, issues[1]?.m, issues[0].sev >= 3 ? "var(--bad)" : "var(--warn)");
    speak(issues[0].m, 2, issues[0].k);
  } else if (S.phase === "moving" && S.breath === (ex.lowerIsInhale ? "in" : "out")) {
    setCue(exKey === "curl" ? "끝까지 올리세요" : "좋아요, 계속 내려가세요", ex.coach, "var(--good)");
  } else {
    setCue("좋은 자세예요", ex.coach, "var(--good)");
  }
}

// 문제가 없을 때도 동작 단계에 맞는 코칭 멘트를 돌아가며 들려줌
function coach(ex, dir, t) {
  const list = ex.cues?.[dir];
  if (!list || t - S.lastCoachAt < 3500) return;
  const line = list[S.cueIdx % list.length];
  if (speak(line, 1)) { S.lastCoachAt = t; if (dir === "up") S.cueIdx++; }
}

function completeRep(ex) {
  S.phase = "up";
  if (S.repInvalid) {
    setCue(`세지 않았어요: ${S.repInvalid}`, `${ex.name} 동작만 1회로 세요`, "var(--warn)");
    speak(`세지 않았어요. ${S.repInvalid}`, 2, "invalid");
    S.repInvalid = null; S.cueHold = performance.now() + 2500;
    return;
  }
  S.count++;
  for (const i of ex.repEnd(S.minAng, S.maxAng)) S.repIssues.set(i.k, i.m);
  const iss = [...S.repIssues.values()];
  for (const [k, m] of S.repIssues) { S.issueTally[k] = (S.issueTally[k] || 0) + 1; S.msgs[k] = m; }
  S.reps.push(iss);
  $("count").textContent = S.count;
  speak(String(S.count), 3);
  if (!iss.length) { setState("var(--good)"); }
  const el = document.createElement("div");
  el.className = "rep " + (iss.length ? "bad" : "ok");
  el.textContent = `${S.count}회 ${iss.length ? "· " + iss.join(", ") : "· 완벽"}`;
  $("reps").prepend(el);
  updateSummary();
  saveSession();
}

function processHold(ex, issues, dt) {
  // 플랭크: 4초 들숨 / 4초 날숨 리듬 안내, 바른 자세일 때만 시간 누적
  const cyc = (S.holdMs / 1000) % 8;
  setBreath(cyc < 4 ? "in" : "out");
  $("breathFill").style.width = `${((cyc % 4) / 4) * 100}%`;
  if (issues.length && issues[0].sev >= 2) {
    S.holdBad += dt;
    setCue(issues[0].m, "자세를 바로잡으면 시간이 다시 올라가요", "var(--bad)");
    speak(issues[0].m, 2, issues[0].k);
    S.issueTally[issues[0].k] = (S.issueTally[issues[0].k] || 0) + dt / 1000; S.msgs[issues[0].k] = issues[0].m;
  } else {
    S.holdMs += dt;
    if (!issues.length && S.holdMs - S.lastHoldCue > 10000) {
      S.lastHoldCue = S.holdMs;
      speak(ex.holdCues[S.cueIdx++ % ex.holdCues.length], 1);
    }
    setCue(issues[0]?.m || "좋아요, 그대로 유지!", ex.coach, issues.length ? "var(--warn)" : "var(--good)");
  }
  const sec = Math.floor(S.holdMs / 1000);
  if (sec >= 3 && sec - S.lastSaveSec >= 5) { S.lastSaveSec = sec; saveSession(); }
  $("count").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
}

function updateSummary() {
  const clean = S.reps.filter(r => !r.length).length;
  const top = Object.entries(S.issueTally).sort((a, b) => b[1] - a[1])[0];
  $("summary").textContent = `바른 자세 ${clean}/${S.count}회` + (top ? ` · 가장 자주 나온 교정: ${S.msgs[top[0]]}` : "");

// ---------- 카메라 / 모델 ----------
async function init() {

async function listCams() {
  const sel = $("cam"), cur = sel.value;
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  sel.innerHTML = "";
  let back = 0;
  cams.forEach((c, i) => {
    const isFront = /front|user|전면/i.test(c.label);
    const name = isFront ? "전면 카메라" : `후면 카메라 ${++back}`;
    sel.add(new Option(`${name}${c.label ? " (" + c.label + ")" : ""}`, c.deviceId));
  });
  sel.value = cur || store.get("camId") || "";
  if (!sel.value && sel.options.length) sel.selectedIndex = 0;
}

function setupZoom(track) {
  const cap = track.getCapabilities?.() || {};
  const z = $("zoom"), wrap = $("zoomWrap");
  if (!cap.zoom) { wrap.style.display = "none"; return; }
  wrap.style.display = "flex";
  z.min = cap.zoom.min; z.max = Math.min(cap.zoom.max, 3); z.step = cap.zoom.step || 0.1;
  const saved = parseFloat(store.get("zoom"));
  z.value = Number.isFinite(saved) ? saved : cap.zoom.min; // 기본은 가장 넓게
  const apply = () => { track.applyConstraints({ advanced: [{ zoom: +z.value }] }).catch(() => {}); $("zoomVal").textContent = (+z.value).toFixed(1) + "배"; };
  z.oninput = () => { store.set("zoom", z.value); apply(); };
  apply();
}

async function start() {
  try {
    if (!landmarker) await init();
    stream?.getTracks().forEach(t => t.stop());
    const id = $("cam").value || store.get("camId");
    const video_c = { width: { ideal: 1280 }, height: { ideal: 720 } };
    if (id) video_c.deviceId = { exact: id }; else video_c.facingMode = "user";
    try { stream = await navigator.mediaDevices.getUserMedia({ video: video_c, audio: false }); }
    catch { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false }); }
    const track = stream.getVideoTracks()[0];
    await listCams();
    const curId = track.getSettings().deviceId; if (curId) $("cam").value = curId;
    setupZoom(track);
    video.srcObject = stream; await video.play();
    W = canvas.width = video.videoWidth; H = canvas.height = video.videoHeight;
    const facingNow = track.getSettings().facingMode || (/front|user/i.test(track.label) ? "user" : "environment");
    const mirror = facingNow === "user" ? "scaleX(-1)" : "none";
    video.style.transform = canvas.style.transform = mirror;
    $("status").textContent = "인식 중입니다. 운동을 시작하세요!";
    enterWorkout();
    if (!running) { running = true; loop(); }
  } catch (e) {
    $("status").textContent = "시작 실패: " + e.message + " (카메라 권한과 인터넷 연결을 확인해주세요)";
  }
}

}
// ---------- 운동 기록 (이 기기 브라우저에 저장) ----------
const loadHist = () => { try { return JSON.parse(store.get("history") || "[]"); } catch { return []; } };
function saveSession() {
  const exKey = $("exercise").value, ex = EX[exKey];
  if (!S.count && S.holdMs < 3000) return;
  const rec = {
    id: S.sid, t: S.sid, ex: exKey, reps: S.count, clean: S.reps.filter(r => !r.length).length,
    holdSec: Math.floor(S.holdMs / 1000),
    issues: Object.entries(S.issueTally).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => [S.msgs[k], Math.round(n)]),
  };
  const h = loadHist(), i = h.findIndex(r => r.id === rec.id);
  if (i >= 0) h[i] = rec; else h.push(rec);
  store.set("history", JSON.stringify(h.slice(-1000)));
  renderHist();
}
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const fmtSec = s => `${Math.floor(s / 60)}분 ${s % 60}초`;
function renderHist() {
  const h = loadHist(), now = Date.now(), today = dayKey(now);
  const days = new Set(h.map(r => dayKey(r.t)));
  let streak = 0;
  for (let d = new Date(); ; d.setDate(d.getDate() - 1)) {
    if (days.has(dayKey(d))) streak++;
    else if (!(streak === 0 && dayKey(d) === today)) break; // 오늘 아직 안 했으면 어제부터 셈
  }
  const todayRecs = h.filter(r => dayKey(r.t) === today);
  const todayReps = todayRecs.reduce((t, r) => t + r.reps, 0);
  const todayHold = todayRecs.reduce((t, r) => t + (r.holdSec || 0), 0);
  const allReps = h.reduce((t, r) => t + r.reps, 0), allClean = h.reduce((t, r) => t + r.clean, 0);
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  $("histStats").innerHTML = stat(todayReps + "회", "오늘 횟수") + (todayHold ? stat(fmtSec(todayHold), "오늘 플랭크") : "")
    + stat(streak + "일", "연속 운동") + stat(allReps ? Math.round(allClean / allReps * 100) + "%" : "-", "바른 자세 비율");

  const bars = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d), n = h.filter(r => dayKey(r.t) === k).reduce((t, r) => t + r.reps, 0);
    bars.push({ n, label: i === 0 ? "오늘" : `${d.getMonth() + 1}/${d.getDate()}`, today: i === 0 });
  }
  const max = Math.max(1, ...bars.map(b => b.n));
  $("histChart").innerHTML = bars.map(b => `<div class="bar${b.today ? " today" : ""}"><span>${b.n || ""}</span><i style="height:${b.n / max * 80}%"></i><span>${b.label}</span></div>`).join("");

  const list = $("histList"); list.innerHTML = "";
  if (!h.length) { list.innerHTML = `<div class="hist-item"><small>아직 기록이 없어요. 운동을 시작하면 자동으로 저장돼요.</small></div>`; return; }
  for (const r of h.slice().reverse().slice(0, 30)) {
    const d = new Date(r.t), ex = EX[r.ex];
    const main = ex?.hold ? `${ex.name} ${fmtSec(r.holdSec)}` : `${ex?.name || r.ex} ${r.reps}회 · 바른 자세 ${r.clean}회`;
    const el = document.createElement("div"); el.className = "hist-item";
    el.append(`${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")} · ${main}`);
    if (r.issues?.length) {
      const sm = document.createElement("small");
      sm.textContent = "자주 나온 교정: " + r.issues.map(([m, n]) => ex?.hold ? `${m} (${n}초)` : `${m} (${n}회)`).join(", ");
      el.append(sm);
    }
    list.append(el);
  }
}

function exitWorkout() {
  if (SW.mode === "rec") finishSwing();
  saveSession();
  document.body.classList.remove("workout");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  running = false; stream?.getTracks().forEach(t => t.stop()); speechSynthesis.cancel();
}

const draw = new DrawingUtils(ctx);
let lastVideoTime = -1;
function loop() {
  if (!running) return;
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const now = performance.now();
    const res = landmarker.detectForVideo(video, now);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const lm = res.landmarks[0];
    if (lm) {
      draw.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: "#4ade80", lineWidth: 4 });
      draw.drawLandmarks(lm, { color: "#fff", radius: 3 });
      process(lm, now, res.worldLandmarks?.[0]);
      swingTick(now);
    } else { swingTick(now); if (SW.mode !== "done") setCue("사람이 보이지 않아요", "몸 전체가 화면에 들어오게 해주세요", "var(--muted)"); }
  }
  requestAnimationFrame(loop);
}

$("start").onclick = start;
$("anaClose").onclick = () => { $("ana").hidden = true; $("rv").pause(); SW.mode = "wait"; SW.frames = []; };
document.querySelectorAll(".ana-ctrl button").forEach(b => b.onclick = () => {
  $("rv").playbackRate = +b.dataset.rate;
  document.querySelectorAll(".ana-ctrl button").forEach(x => x.classList.toggle("on", x === b));
});
$("cam").onchange = () => { store.set("camId", $("cam").value); store.set("zoom", ""); if (running) start(); };
$("exit").onclick = exitWorkout;
$("reset").onclick = resetState;
$("exercise").onchange = resetState;
$("voice").onclick = () => { voiceOn = !voiceOn; $("voice").textContent = "음성: " + (voiceOn ? "켜짐" : "꺼짐"); };
const BREATH_KO = { tone: "신호음", voice: "말로", off: "끔" };
const showBreath = () => $("breathVoice").textContent = "호흡: " + BREATH_KO[breathMode];
$("breathVoice").onclick = () => { breathMode = { tone: "voice", voice: "off", off: "tone" }[breathMode]; store.set("breathMode", breathMode); showBreath(); if (breathMode === "tone") tone(true); };
showBreath();
resetState();
renderHist();
$("histClear").onclick = () => { if (confirm("운동 기록을 모두 지울까요? 되돌릴 수 없어요.")) { store.set("history", "[]"); renderHist(); } };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveSession(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
// 운동 중 화면 꺼짐 방지
let wakeLock;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
$("start").addEventListener("click", keepAwake);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && running) keepAwake(); });
</script>
