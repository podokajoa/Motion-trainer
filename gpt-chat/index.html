<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼자대면</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1f1d1a; --muted: #77716a; --line: #e2ddd5;
    --mina: #2f5bd3; --mina-ink: #ffffff;
    --claude: #fbe9dd; --claude-tag: #c25a1f;
    --gpt: #e1f2e7; --gpt-tag: #1f7a46;
    --err: #fde8e8; --err-ink: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --panel: #211f24; --ink: #ece8e2; --muted: #9a948c; --line: #34313a;
      --mina: #4a72e6; --claude: #3a2a20; --claude-tag: #f0a070; --gpt: #1e3327; --gpt-tag: #6fd39a;
      --err: #3a1f1f; --err-ink: #f3a3a3;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; display: flex; flex-direction: row; }
  main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
  aside { width: 240px; flex: none; height: 100%; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  aside .top { padding: 12px; display: flex; gap: 8px; align-items: center; }
  aside .top b { flex: 1; font-size: 15px; }
  #rooms { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .room { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .room:hover { background: var(--bg); }
  .room.on { background: var(--bg); font-weight: 700; }
  .room .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room .sub { font-size: 11px; color: var(--muted); font-weight: 400; }
  .room .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mina); flex: none; }
  .room .x { border: 0; background: none; padding: 0 4px; color: var(--muted); visibility: hidden; }
  .room:hover .x { visibility: visible; }
  #menu { display: none; padding: 6px 10px; }
  @media (max-width: 700px) {
    aside { position: fixed; z-index: 5; left: 0; top: 0; transform: translateX(-100%); transition: transform .15s; }
    aside.open { transform: none; box-shadow: 0 0 30px rgba(0,0,0,.4); }
    #menu { display: inline-block; }
  }
  header { flex-wrap: wrap; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .who { font-size: 13px; color: var(--muted); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
  .msg .tag { display: block; font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .mina { align-self: flex-end; background: var(--mina); color: var(--mina-ink); border-bottom-right-radius: 4px; }
  .claude { align-self: flex-start; background: var(--claude); border-bottom-left-radius: 4px; }
  .claude .tag { color: var(--claude-tag); }
  .gpt { align-self: flex-start; background: var(--gpt); border-bottom-left-radius: 4px; }
  .gpt .tag { color: var(--gpt-tag); }
  .note { align-self: center; background: transparent; color: var(--muted); font-size: 13px; padding: 2px 8px; }
  select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; max-width: 150px; }
  .models { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .system { align-self: center; background: var(--err); color: var(--err-ink); font-size: 13px; max-width: 92%; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  #typing { min-height: 22px; padding: 0 16px; font-size: 13px; color: var(--muted); max-width: 820px; width: 100%; margin: 0 auto; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px 14px; }
  .inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .spacer { flex: 1; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 46px; max-height: 160px; }
  #attach { padding: 10px 12px; }
  #chosen { display: flex; gap: 6px; flex-wrap: wrap; }
  #chosen span { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 6px 2px 10px; }
  #chosen button { border: 0; background: none; padding: 0 4px; color: var(--muted); }
  .msg img { display: block; max-width: 240px; max-height: 240px; border-radius: 10px; margin: 4px 0; }
  .msg .file { display: inline-block; font-size: 13px; opacity: .85; margin: 2px 0; }
  #send { background: var(--mina); color: #fff; border-color: var(--mina); padding: 10px 18px; }
</style>
</head>
<body>
<aside id="side">
  <div class="top"><b>삼자대면</b><button id="newroom">＋ 새 대화</button></div>
  <div id="rooms"></div>
</aside>
<main>
<header>
  <button id="menu" title="대화 목록">☰</button>
  <h1 id="title">삼자대면</h1>
  <span class="models">
    <label>Claude <select id="m-claude"><option value="">기본</option></select></label>
    <label>GPT <select id="m-gpt"><option value="">기본</option></select></label>
  </span>
</header>

<div id="log"></div>
<div id="typing"></div>

<footer>
  <div class="inner">
    <div class="row">
      <span style="font-size:13px;color:var(--muted)">누가 답할까</span>
      <button class="chip" data-to="both" aria-pressed="true">둘 다</button>
      <button class="chip" data-to="claude" aria-pressed="false">Claude만</button>
      <button class="chip" data-to="gpt" aria-pressed="false">GPT만</button>
      <span class="spacer"></span>
      <button id="debate" title="Claude와 GPT가 두 번씩 주고받아요">둘이 토론시키기</button>
    </div>
    <div id="chosen"></div>
    <div class="row">
      <input type="file" id="picker" multiple hidden accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.log,.xml,.yml,.yaml,.kt,.java">
      <button id="attach" title="사진·글자 파일 올리기 (붙여넣기, 끌어다 놓기도 돼요)">📎</button>
      <textarea id="text" rows="1" placeholder="메시지 입력 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea>
      <button id="send">보내기</button>
    </div>
  </div>
</footer>
</main>

<script>
  const NAMES = { mina: '미나', claude: 'Claude', gpt: 'GPT' };
  const log = document.getElementById('log');
  const typingEl = document.getElementById('typing');
  const text = document.getElementById('text');
  const sendBtn = document.getElementById('send');
  const debateBtn = document.getElementById('debate');
  const titleEl = document.getElementById('title');
  const sideEl = document.getElementById('side');
  const roomsEl = document.getElementById('rooms');
  let to = 'both';
  let busy = false;

  function render(messages) {
    log.innerHTML = '';
    if (!messages.length) {
      log.innerHTML = '<div class="empty">주제를 던져 보세요.<br>Claude와 GPT가 각자 답하고, 서로의 말도 기억해요.</div>';
      return;
    }
    messages.forEach(add);
  }

  function add(m) {
    const empty = log.querySelector('.empty');
    if (empty) empty.remove();
    const el = document.createElement('div');
    el.className = 'msg ' + (m.note ? 'note' : m.system ? 'system' : m.who);
    if (m.who !== 'mina' && !m.system) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = NAMES[m.who];
      el.appendChild(tag);
    }
    const body = document.createElement('span');
    // **굵게** 만 표시하고 나머지는 글자 그대로
    body.innerHTML = m.text.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    el.appendChild(body);
    (m.files || []).forEach((f) => {
      if (f.kind === 'image') {
        const img = document.createElement('img');
        img.src = '/uploads/' + encodeURIComponent(f.file);
        img.alt = f.name;
        el.insertBefore(img, body);
      } else {
        const t = document.createElement('div');
        t.className = 'file';
        t.textContent = '📄 ' + f.name;
        el.insertBefore(t, body);
      }
    });
    if (!m.text) body.remove();
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function setBusy(b) {
    busy = b;
    sendBtn.disabled = debateBtn.disabled = b;
  }

  function setTyping(t) {
    const who = ['claude', 'gpt'].filter((k) => t[k]).map((k) => NAMES[k]);
    typingEl.textContent = who.length ? who.join(', ') + ' 입력 중…' : '';
  }

  const es = new EventSource('/api/events');

  // ---- 대화방 목록 (스레드처럼 방마다 따로) ----
  let rooms = [], active = null, loaded = null;
  const unread = new Set();
  try { active = localStorage.getItem('room'); } catch (_) {}

  function ago(t) {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return '방금';
    if (m < 60) return m + '분 전';
    if (m < 1440) return Math.round(m / 60) + '시간 전';
    return Math.round(m / 1440) + '일 전';
  }

  function drawRooms() {
    roomsEl.innerHTML = '';
    rooms.forEach((r) => {
      const el = document.createElement('div');
      el.className = 'room' + (r.id === active ? ' on' : '');
      const t = document.createElement('div');
      t.className = 't';
      t.textContent = r.title;
      const sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = r.busy ? '답하는 중…' : ago(r.t);
      t.appendChild(sub);
      el.appendChild(t);
      if (unread.has(r.id)) { const d = document.createElement('span'); d.className = 'dot'; el.appendChild(d); }
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '✕'; x.title = '이 대화 지우기';
      x.onclick = async (e) => {
        e.stopPropagation();
        if (confirm('"' + r.title + '" 대화를 지울까요?')) await post('/api/rooms/delete', { id: r.id });
      };
      el.appendChild(x);
      el.onclick = () => { openRoom(r.id); sideEl.classList.remove('open'); };
      el.ondblclick = async () => {
        const n = prompt('대화 이름', r.title);
        if (n && n.trim()) await post('/api/rooms/rename', { id: r.id, title: n.trim() });
      };
      roomsEl.appendChild(el);
    });
  }

  async function openRoom(id) {
    active = id; loaded = id; unread.delete(id);
    try { localStorage.setItem('room', id); } catch (_) {}
    const d = await (await fetch('/api/room?id=' + encodeURIComponent(id))).json();
    if (active !== id) return;
    render(d.messages); setTyping(d.typing); setBusy(d.busy);
    titleEl.textContent = d.title;
    drawRooms();
  }

  es.addEventListener('rooms', (e) => {
    rooms = JSON.parse(e.data);
    const cur = rooms.find((r) => r.id === active);
    if (!cur) { openRoom(rooms[0].id); return; }
    if (loaded !== active) { openRoom(active); return; }
    setBusy(cur.busy); titleEl.textContent = cur.title;
    drawRooms();
  });
  es.addEventListener('message', (e) => {
    const d = JSON.parse(e.data);
    if (d.room === active) add(d.msg);
    else if (!d.msg.system) { unread.add(d.room); drawRooms(); }
  });
  es.addEventListener('typing', (e) => { const d = JSON.parse(e.data); if (d.room === active) setTyping(d.typing); });
  document.getElementById('newroom').addEventListener('click', async () => {
    const r = await fetch('/api/rooms/new', { method: 'POST' });
    if (r.ok) { const d = await r.json(); await openRoom(d.id); sideEl.classList.remove('open'); text.focus(); }
  });
  document.getElementById('menu').addEventListener('click', () => sideEl.classList.toggle('open'));
  es.onerror = () => { typingEl.textContent = '서버와 연결이 끊겼어요. 검은 창(start.bat)이 켜져 있는지 확인해 주세요.'; };

  document.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => {
    to = b.dataset.to;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
  }));

  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    return r.ok;
  }

  let pending = [];
  const chosen = document.getElementById('chosen');
  const picker = document.getElementById('picker');
  function drawChosen() {
    chosen.innerHTML = '';
    pending.forEach((f, i) => {
      const s = document.createElement('span');
      s.textContent = f.name;
      const x = document.createElement('button');
      x.textContent = '✕';
      x.onclick = () => { pending.splice(i, 1); drawChosen(); };
      s.appendChild(x);
      chosen.appendChild(s);
    });
  }
  function addFiles(list) {
    for (const f of list) {
      if (pending.length >= 4) { alert('파일은 한 번에 4개까지예요.'); break; }
      pending.push(f);
    }
    drawChosen();
  }
  document.getElementById('attach').addEventListener('click', () => picker.click());
  picker.addEventListener('change', () => { addFiles(picker.files); picker.value = ''; });
  text.addEventListener('paste', (e) => {
    const fs = [...(e.clipboardData ? e.clipboardData.files : [])];
    if (fs.length) { e.preventDefault(); addFiles(fs.map((f) => (f.name && f.name !== 'image.png') ? f : new File([f], 'paste-' + Date.now() + '.png', { type: f.type }))); }
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  const toB64 = (f) => new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1]);
    r.onerror = no;
    r.readAsDataURL(f);
  });

  async function send() {
    const v = text.value.trim();
    if ((!v && !pending.length) || busy) return;
    const files = await Promise.all(pending.map(async (f) => ({ name: f.name, data: await toB64(f) })));
    const r = await fetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: v, to, files, room: active }) });
    if (r.ok) { text.value = ''; pending = []; drawChosen(); autosize(); }
    else { try { alert((await r.json()).error || '보내지 못했어요.'); } catch (_) { alert('보내지 못했어요.'); } }
  }

  sendBtn.addEventListener('click', send);
  text.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  function autosize() { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 160) + 'px'; }
  text.addEventListener('input', autosize);

  const sel = { claude: document.getElementById('m-claude'), gpt: document.getElementById('m-gpt') };
  function showModels(cur) { for (const k in sel) sel[k].value = cur[k] || ''; }
  fetch('/api/models').then((r) => r.json()).then((d) => {
    for (const k of ['claude', 'gpt']) {
      for (const m of d[k]) {
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.name;
        sel[k].appendChild(o);
      }
      if (d.current[k] && ![...sel[k].options].some((o) => o.value === d.current[k])) {
        const o = document.createElement('option'); o.value = o.textContent = d.current[k]; sel[k].appendChild(o);
      }
    }
    showModels(d.current);
  }).catch(() => {});
  for (const k in sel) sel[k].addEventListener('change', () => post('/api/models', { [k]: sel[k].value, room: active }));
  es.addEventListener('models', (e) => showModels(JSON.parse(e.data)));

  debateBtn.addEventListener('click', () => post('/api/debate', { rounds: 2, room: active }));
</script>
</body>
</html>
