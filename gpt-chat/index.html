<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼자대면</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1f1d1a; --muted: #77716a; --line: #e2ddd5;
    --mina: #2f5bd3; --mina-ink: #ffffff;
    --claude: #fbe9dd; --claude-tag: #c25a1f;
    --gpt: #e1f2e7; --gpt-tag: #1f7a46;
    --err: #fde8e8; --err-ink: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --panel: #211f24; --ink: #ece8e2; --muted: #9a948c; --line: #34313a;
      --mina: #4a72e6; --claude: #3a2a20; --claude-tag: #f0a070; --gpt: #1e3327; --gpt-tag: #6fd39a;
      --err: #3a1f1f; --err-ink: #f3a3a3;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .who { font-size: 13px; color: var(--muted); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
  .msg .tag { display: block; font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .mina { align-self: flex-end; background: var(--mina); color: var(--mina-ink); border-bottom-right-radius: 4px; }
  .claude { align-self: flex-start; background: var(--claude); border-bottom-left-radius: 4px; }
  .claude .tag { color: var(--claude-tag); }
  .gpt { align-self: flex-start; background: var(--gpt); border-bottom-left-radius: 4px; }
  .gpt .tag { color: var(--gpt-tag); }
  .system { align-self: center; background: var(--err); color: var(--err-ink); font-size: 13px; max-width: 92%; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  #typing { min-height: 22px; padding: 0 16px; font-size: 13px; color: var(--muted); max-width: 820px; width: 100%; margin: 0 auto; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px 14px; }
  .inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .spacer { flex: 1; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 46px; max-height: 160px; }
  #send { background: var(--mina); color: #fff; border-color: var(--mina); padding: 10px 18px; }
</style>
</head>
<body>
<header>
  <h1>삼자대면</h1>
  <span class="who">미나 · Claude · GPT</span>
  <button id="reset" title="대화를 지우고 새로 시작">새 대화</button>
</header>

<div id="log"></div>
<div id="typing"></div>

<footer>
  <div class="inner">
    <div class="row">
      <span style="font-size:13px;color:var(--muted)">누가 답할까</span>
      <button class="chip" data-to="both" aria-pressed="true">둘 다</button>
      <button class="chip" data-to="claude" aria-pressed="false">Claude만</button>
      <button class="chip" data-to="gpt" aria-pressed="false">GPT만</button>
      <span class="spacer"></span>
      <button id="debate" title="Claude와 GPT가 두 번씩 주고받아요">둘이 토론시키기</button>
    </div>
    <div class="row">
      <textarea id="text" rows="1" placeholder="메시지 입력 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea>
      <button id="send">보내기</button>
    </div>
  </div>
</footer>

<script>
  const NAMES = { mina: '미나', claude: 'Claude', gpt: 'GPT' };
  const log = document.getElementById('log');
  const typingEl = document.getElementById('typing');
  const text = document.getElementById('text');
  const sendBtn = document.getElementById('send');
  const debateBtn = document.getElementById('debate');
  const resetBtn = document.getElementById('reset');
  let to = 'both';
  let busy = false;

  function render(messages) {
    log.innerHTML = '';
    if (!messages.length) {
      log.innerHTML = '<div class="empty">주제를 던져 보세요.<br>Claude와 GPT가 각자 답하고, 서로의 말도 기억해요.</div>';
      return;
    }
    messages.forEach(add);
  }

  function add(m) {
    const empty = log.querySelector('.empty');
    if (empty) empty.remove();
    const el = document.createElement('div');
    el.className = 'msg ' + (m.system ? 'system' : m.who);
    if (m.who !== 'mina' && !m.system) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = NAMES[m.who];
      el.appendChild(tag);
    }
    el.appendChild(document.createTextNode(m.text));
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function setBusy(b) {
    busy = b;
    sendBtn.disabled = debateBtn.disabled = resetBtn.disabled = b;
  }

  function setTyping(t) {
    const who = ['claude', 'gpt'].filter((k) => t[k]).map((k) => NAMES[k]);
    typingEl.textContent = who.length ? who.join(', ') + ' 입력 중…' : '';
  }

  const es = new EventSource('/api/events');
  es.addEventListener('init', (e) => { const d = JSON.parse(e.data); render(d.messages); setTyping(d.typing); setBusy(d.busy); });
  es.addEventListener('message', (e) => add(JSON.parse(e.data)));
  es.addEventListener('typing', (e) => setTyping(JSON.parse(e.data)));
  es.addEventListener('busy', (e) => setBusy(JSON.parse(e.data)));
  es.onerror = () => { typingEl.textContent = '서버와 연결이 끊겼어요. 검은 창(start.bat)이 켜져 있는지 확인해 주세요.'; };

  document.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => {
    to = b.dataset.to;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
  }));

  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    return r.ok;
  }

  async function send() {
    const v = text.value.trim();
    if (!v || busy) return;
    if (await post('/api/send', { text: v, to })) { text.value = ''; autosize(); }
  }

  sendBtn.addEventListener('click', send);
  text.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  function autosize() { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 160) + 'px'; }
  text.addEventListener('input', autosize);

  debateBtn.addEventListener('click', () => post('/api/debate', { rounds: 2 }));
  resetBtn.addEventListener('click', () => { if (confirm('지금 대화를 지우고 새로 시작할까요?')) post('/api/reset'); });
</script>
</body>
</html>
